<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ムームーレインボー ホテル配送エリアマップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; }
#map { width: 100%; height: 100%; }

.legend {
  background: white;
  padding: 12px 16px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  font-size: 13px;
  line-height: 1.8;
  max-width: 280px;
}
.legend h4 {
  margin: 0 0 8px 0;
  font-size: 14px;
  border-bottom: 1px solid #ddd;
  padding-bottom: 6px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
}
.legend-color {
  width: 18px;
  height: 18px;
  border-radius: 3px;
  flex-shrink: 0;
  border: 1px solid rgba(0,0,0,0.2);
}
.legend-label { font-size: 12px; }
.legend small { display:block; margin-top:8px; color:#555; font-size:11px; line-height:1.5; }

.title-bar {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  background: rgba(255,255,255,0.95);
  padding: 8px 20px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  font-size: 16px;
  font-weight: bold;
  white-space: nowrap;
}

/* ポップアップ */
.hotel-popup h3 { font-size: 14px; margin-bottom: 4px; }
.hotel-popup .area { font-size: 12px; color: #666; }
.hotel-popup .price { font-size: 14px; font-weight: bold; margin-top: 4px; }
.hotel-popup .price.free { color: #2d8a4e; }
.hotel-popup .price.mid { color: #d97706; }
.hotel-popup .price.high { color: #dc2626; }

/* 店舗マーカー */
.store-marker {
  background: #e03384;
  color: white;
  border: 3px solid white;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  text-align: center;
  line-height: 22px;
  font-weight: bold;
  font-size: 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
</style>
</head>
<body>

<div class="title-bar">ムームーレインボー ホテル配送エリアマップ</div>
<div id="map"></div>

<script>
// ===== 店舗座標（ワイキキビジネスプラザ 2270 Kalakaua Ave #1105） =====
const STORE_LAT = 21.2785;
const STORE_LNG = -157.8276;

// マップ初期化（店舗中心）
const map = L.map('map').setView([STORE_LAT, STORE_LNG], 14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

// ===== エリア境界（店舗中心の同心円） =====

// B境界: 半径2000m（オレンジ - 下層）
L.circle([STORE_LAT, STORE_LNG], {
  radius: 2000,
  color: '#d97706',
  fillColor: '#f59e0b',
  fillOpacity: 0.12,
  weight: 2,
  dashArray: '6,6'
}).addTo(map).bindPopup('<b>B エリア境界</b><br>店舗から約2km<br>+$40');

// A境界: 半径800m（緑 - 上層）
L.circle([STORE_LAT, STORE_LNG], {
  radius: 800,
  color: '#16a34a',
  fillColor: '#22c55e',
  fillOpacity: 0.2,
  weight: 2
}).addTo(map).bindPopup('<b>A エリア境界</b><br>店舗から約800m（徒歩10分）<br>基本料金');

// ===== 店舗マーカー =====
const storeIcon = L.divIcon({
  className: 'store-marker',
  html: '★',
  iconSize: [28, 28],
  iconAnchor: [14, 14]
});
L.marker([STORE_LAT, STORE_LNG], { icon: storeIcon })
  .addTo(map)
  .bindPopup('<b>ムームーレインボー</b><br>2270 Kalakaua Ave #1105<br>Waikiki Business Plaza');

// ===== ホテルマーカー =====
function createMarker(lat, lng, name, areaLabel, price, color) {
  const icon = L.circleMarker([lat, lng], {
    radius: 7,
    fillColor: color,
    color: '#fff',
    weight: 2,
    opacity: 1,
    fillOpacity: 0.9
  });

  let priceClass = 'free', priceText = '基本料金';
  if (price === 40) { priceClass = 'mid'; priceText = '+$40'; }
  else if (price === 50) { priceClass = 'high'; priceText = '+$50'; }

  icon.bindPopup(`
    <div class="hotel-popup">
      <h3>${name}</h3>
      <div class="area">${areaLabel}</div>
      <div class="price ${priceClass}">${priceText}</div>
    </div>
  `);
  return icon.addTo(map);
}

// ===== A エリア（緑・基本料金） =====
createMarker(21.2763, -157.8273, 'アウトリガー・ワイキキ・ビーチ・リゾート', 'A: 徒歩10分圏内', 0, '#16a34a');
createMarker(21.2785, -157.8315, 'アウトリガー・リーフ', 'A: 徒歩10分圏内', 0, '#16a34a');
createMarker(21.2769, -157.8292, 'シェラトン・ワイキキ', 'A: 徒歩10分圏内', 0, '#16a34a');
createMarker(21.2770, -157.8285, 'ロイヤル・ハワイアン', 'A: 徒歩10分圏内', 0, '#16a34a');
createMarker(21.2764, -157.8268, 'モアナ・サーフライダー', 'A: 徒歩10分圏内', 0, '#16a34a');
createMarker(21.2778, -157.8305, 'ハレクラニ', 'A: 徒歩10分圏内', 0, '#16a34a');
createMarker(21.2757, -157.8250, 'ハイアット・リージェンシー', 'A: 徒歩10分圏内', 0, '#16a34a');
createMarker(21.2790, -157.8320, 'カライ・ワイキキ・ビーチ', 'A: 徒歩10分圏内', 0, '#16a34a');
createMarker(21.2810, -157.8290, 'リッツ・カールトン', 'A: 徒歩10分圏内', 0, '#16a34a');

// ===== B エリア（オレンジ・+$40） =====
createMarker(21.2738, -157.8238, 'アロヒラニ・リゾート', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');
createMarker(21.2740, -157.8235, 'ワイキキ・ビーチ・マリオット', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');
createMarker(21.2735, -157.8245, 'ヒルトン・ワイキキ・ビーチ', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');
createMarker(21.2733, -157.8240, 'ハイアット・プレイス・ワイキキ', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');
createMarker(21.2742, -157.8232, 'アストン・ワイキキ・ビーチ', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');
createMarker(21.2830, -157.8370, 'ヒルトン・ハワイアン・ビレッジ', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');
createMarker(21.2870, -157.8400, 'モダン・ホノルル', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');
createMarker(21.2880, -157.8410, 'プリンス・ワイキキ', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');
createMarker(21.2848, -157.8388, 'イリカイ・ホテル', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');
createMarker(21.2830, -157.8340, 'ダブルツリー・アラナ', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');
createMarker(21.2895, -157.8440, 'アラモアナ・ホテル', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');
createMarker(21.2820, -157.8355, 'ルアナ・ワイキキ', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');
createMarker(21.2710, -157.8230, 'パーク・ショア・ワイキキ', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');
createMarker(21.2720, -157.8215, 'クイーン・カピオラニ', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');
createMarker(21.2652, -157.8215, 'カイマナ・ビーチ・ホテル', 'B: 徒歩圏外〜車で近距離', 40, '#d97706');

// ===== C エリア（赤・+$50） =====
createMarker(21.2695, -157.7735, 'カハラ・ホテル＆リゾート', 'C: 遠方', 50, '#dc2626');
createMarker(21.2638, -157.8198, 'ロータス・ホノルル', 'C: 遠方', 50, '#dc2626');
createMarker(21.2580, -157.8120, 'ダイヤモンドヘッド・ビーチ・ホテル', 'C: 遠方', 50, '#dc2626');

// ===== 凡例 =====
const legend = L.control({ position: 'topright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <h4>配送料金エリア</h4>
    <div class="legend-item">
      <div class="legend-color" style="background:#22c55e;"></div>
      <span class="legend-label"><b>A</b>: 徒歩10分圏内（基本料金）</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background:#f59e0b;"></div>
      <span class="legend-label"><b>B</b>: 徒歩圏外〜車で近距離（+$40）</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background:#ef4444;"></div>
      <span class="legend-label"><b>C</b>: 遠方（+$50）</span>
    </div>
    <small>★ = ムームーレインボー店舗<br>同心円は店舗から800m・2kmの目安</small>
  `;
  return div;
};
legend.addTo(map);
</script>

</body>
</html>
